<div *ngIf="isOpen" class="fixed inset-0 z-50 overflow-y-auto bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl shadow-2xl border border-slate-200 max-w-xl w-full p-6 space-y-5 animate-in fade-in zoom-in-95 duration-200">
    
    <!-- Encabezado -->
    <div class="flex items-center justify-between border-b border-slate-100 pb-3">
      <div>
        <h3 class="text-base font-bold text-slate-900 flex items-center gap-2">
          <span>📦</span> Despacho a Almacén Móvil de Técnico
        </h3>
        <p class="text-xs text-slate-500">Salida física vinculada a Orden de Trabajo y asignación inmediata</p>
      </div>
      <button type="button" (click)="closeModal()" class="text-slate-400 hover:text-slate-600 text-lg">✕</button>
    </div>

    <!-- Error Descriptivo -->
    <div *ngIf="errorMessage" class="p-3 bg-rose-50 border border-rose-200 text-rose-800 rounded-xl text-xs flex items-center gap-2">
      <span class="text-base font-bold text-rose-600">⚠️</span>
      <p class="font-medium">{{ errorMessage }}</p>
    </div>

    <!-- Éxito -->
    <div *ngIf="successMessage" class="p-3 bg-emerald-50 border border-emerald-200 text-emerald-800 rounded-xl text-xs flex items-center gap-2">
      <span class="text-base font-bold text-emerald-600">✓</span>
      <p class="font-medium">{{ successMessage }}</p>
    </div>

    <div class="space-y-4">
      <!-- 1. Vinculación obligatoria a Orden de Trabajo -->
      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1">
          Orden de Trabajo Asociada *
        </label>
        <select [(ngModel)]="selectedOrderId" class="w-full text-xs px-3 py-2 border border-slate-300 rounded-lg bg-white">
          <option value="">-- Seleccionar Orden de Trabajo --</option>
          <option *ngFor="let o of workOrders" [value]="o.id">
            {{ o.code }} - {{ o.client }}
          </option>
        </select>
        <p class="text-[10px] text-slate-400 mt-1">El sistema impide despachos sin orden técnica asociada.</p>
      </div>

      <!-- 2. Repuesto y Técnico -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">Repuesto / Insumo Central *</label>
          <select [(ngModel)]="selectedSpareId" class="w-full text-xs px-3 py-2 border border-slate-300 rounded-lg bg-white">
            <option *ngFor="let s of availableSpares" [value]="s.id">
              {{ s.name }} (Stock: {{ s.centralStock }} {{ s.unit }})
            </option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">Técnico de Campo Asignado *</label>
          <select [(ngModel)]="selectedTechId" class="w-full text-xs px-3 py-2 border border-slate-300 rounded-lg bg-white">
            <option *ngFor="let t of technicians" [value]="t.id">{{ t.name }}</option>
          </select>
        </div>
      </div>

      <!-- 3. Cantidad a transferir -->
      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1">Cantidad a Asignar *</label>
        <input type="number" min="1" [(ngModel)]="dispatchQuantity" class="w-32 text-xs px-3 py-2 border border-slate-300 rounded-lg font-bold text-slate-900" />
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1">Motivo / Observación de Salida</label>
        <input type="text" [(ngModel)]="notes" class="w-full text-xs px-3 py-2 border border-slate-300 rounded-lg" />
      </div>
    </div>

    <!-- Botones -->
    <div class="flex justify-end gap-2 pt-3 border-t border-slate-100">
      <button type="button" (click)="closeModal()" class="px-4 py-2 border border-slate-200 text-slate-600 rounded-xl text-xs font-semibold hover:bg-slate-50">Cancelar</button>
      <button type="button" (click)="submitDispatch()" class="px-5 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-bold shadow-xs">
        Confirmar Despacho a Técnico
      </button>
    </div>

  </div>
</div>
