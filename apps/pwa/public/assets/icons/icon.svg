<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0369a1"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="dropGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0284c7" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- Background with rounded corners for adaptive icons -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Outer Filtration Ring (Molecular Purity) -->
  <circle cx="256" cy="268" r="148" fill="none" stroke="#38bdf8" stroke-width="8" stroke-dasharray="16 12" opacity="0.45"/>
  <circle cx="256" cy="268" r="182" fill="none" stroke="#7dd3fc" stroke-width="4" stroke-dasharray="8 16" opacity="0.3"/>
  
  <!-- Water Drop Symbol -->
  <g filter="url(#glow)">
    <path d="M 256 112 C 256 112 152 248 152 316 C 152 373.4 198.6 420 256 420 C 313.4 420 360 373.4 360 316 C 360 248 256 112 256 112 Z" fill="url(#dropGrad)"/>
    
    <!-- Drop Highlight -->
    <path d="M 220 250 C 205 275 200 305 204 330 C 200 320 200 295 212 268 C 220 250 232 232 242 216 C 234 228 226 240 220 250 Z" fill="#ffffff" opacity="0.55"/>
    
    <!-- Monogram F for Fildlab -->
    <text x="256" y="342" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="96" fill="#ffffff" text-anchor="middle">F</text>
  </g>
</svg>
