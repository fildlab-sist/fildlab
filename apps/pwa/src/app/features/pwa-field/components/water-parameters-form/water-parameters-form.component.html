<div class="bg-white p-4 sm:p-5 rounded-2xl border border-slate-200/80 shadow-xs space-y-4">
  <!-- Encabezado de Parámetros con Métricas en Vivo -->
  <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 border-b border-slate-100 pb-3">
    <div>
      <h3 class="text-xs font-bold uppercase tracking-wider text-slate-500 flex items-center gap-1.5">
        <span class="w-2 h-2 rounded-full bg-sky-500"></span>
        Calidad Físico-Química y Volumetría
      </h3>
    </div>
    <div class="flex items-center gap-1.5 self-start sm:self-auto">
      <span class="text-[11px] bg-emerald-50 text-emerald-700 border border-emerald-200 px-2 py-0.5 rounded-lg font-bold">
        Rendimiento: {{ recoveryPercentage }}%
      </span>
      <span class="text-[11px] bg-sky-50 text-sky-700 border border-sky-200 px-2 py-0.5 rounded-lg font-bold">
        Rechazo: {{ saltRejectionPercentage }}%
      </span>
    </div>
  </div>

  <!-- Bloque 1: Sólidos Disueltos (TDS - PPM) -->
  <div class="space-y-2">
    <span class="text-[11px] font-bold text-slate-700 uppercase tracking-wide">
      Sólidos Disueltos Totales (TDS)
    </span>
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-2.5">
      <div class="bg-slate-50 p-2.5 rounded-xl border border-slate-200/80">
        <label class="block text-[11px] font-medium text-slate-600 mb-1">1. Entrada (Red)</label>
        <div class="relative">
          <input
            type="number"
            [(ngModel)]="params.inletTdsPpm"
            (ngModelChange)="onParamChange()"
            class="w-full px-2.5 py-1.5 border rounded-lg bg-white font-bold text-slate-900 focus:ring-2 focus:ring-sky-500 text-sm"
          />
          <span class="absolute right-2.5 top-2 text-[10px] text-slate-400 font-semibold">ppm</span>
        </div>
      </div>
      <div class="bg-slate-50 p-2.5 rounded-xl border border-slate-200/80">
        <label class="block text-[11px] font-medium text-slate-600 mb-1">2. Post Membrana</label>
        <div class="relative">
          <input
            type="number"
            [(ngModel)]="params.postMembraneTdsPpm"
            (ngModelChange)="onParamChange()"
            class="w-full px-2.5 py-1.5 border rounded-lg bg-white font-bold text-sky-700 focus:ring-2 focus:ring-sky-500 text-sm"
          />
          <span class="absolute right-2.5 top-2 text-[10px] text-slate-400 font-semibold">ppm</span>
        </div>
      </div>
      <div class="bg-slate-50 p-2.5 rounded-xl border border-slate-200/80">
        <label class="block text-[11px] font-medium text-slate-600 mb-1">3. Producto Final</label>
        <div class="relative">
          <input
            type="number"
            step="0.1"
            [(ngModel)]="params.finalProductTdsPpm"
            (ngModelChange)="onParamChange()"
            class="w-full px-2.5 py-1.5 border rounded-lg bg-white font-bold text-emerald-700 focus:ring-2 focus:ring-sky-500 text-sm"
          />
          <span class="absolute right-2.5 top-2 text-[10px] text-slate-400 font-semibold">ppm</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Bloque 2: Calidad Físico-Química -->
  <div class="space-y-2">
    <span class="text-[11px] font-bold text-slate-700 uppercase tracking-wide">
      Calidad Físico-Química
    </span>
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-2.5">
      <div class="bg-slate-50 p-2.5 rounded-xl border border-slate-200/80">
        <label class="block text-[11px] font-medium text-slate-600 mb-1">4. pH</label>
        <input
          type="number"
          step="0.01"
          min="0"
          max="14"
          [(ngModel)]="params.ph"
          (ngModelChange)="onParamChange()"
          class="w-full px-2.5 py-1.5 border rounded-lg bg-white font-bold text-slate-900 focus:ring-2 focus:ring-sky-500 text-sm"
        />
      </div>
      <div class="bg-slate-50 p-2.5 rounded-xl border border-slate-200/80">
        <label class="block text-[11px] font-medium text-slate-600 mb-1">5. Conductividad</label>
        <div class="relative">
          <input
            type="number"
            step="0.1"
            [(ngModel)]="params.conductivityUs"
            (ngModelChange)="onParamChange()"
            class="w-full px-2.5 py-1.5 border rounded-lg bg-white font-bold text-sky-700 focus:ring-2 focus:ring-sky-500 text-sm"
          />
          <span class="absolute right-2 top-2 text-[10px] text-slate-400 font-semibold">µS/cm</span>
        </div>
      </div>
      <div class="bg-slate-50 p-2.5 rounded-xl border border-slate-200/80">
        <label class="block text-[11px] font-medium text-slate-600 mb-1">6. Resistividad</label>
        <div class="relative">
          <input
            type="number"
            step="0.1"
            [(ngModel)]="params.resistivityMohm"
            (ngModelChange)="onParamChange()"
            class="w-full px-2.5 py-1.5 border rounded-lg bg-white font-bold text-indigo-700 focus:ring-2 focus:ring-sky-500 text-sm"
          />
          <span class="absolute right-2 top-2 text-[10px] text-slate-400 font-semibold">MΩ·cm</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Bloque 3: Volumetría -->
  <div class="space-y-2">
    <span class="text-[11px] font-bold text-slate-700 uppercase tracking-wide">
      Volumetría de Agua
    </span>
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
      <div class="bg-slate-50 p-2.5 rounded-xl border border-slate-200/80">
        <label class="block text-[11px] font-medium text-slate-600 mb-1">7. Litros Consumidos (Red)</label>
        <div class="relative">
          <input
            type="number"
            [(ngModel)]="params.networkConsumedLiters"
            (ngModelChange)="onParamChange()"
            class="w-full px-2.5 py-1.5 border rounded-lg bg-white font-bold text-slate-900 focus:ring-2 focus:ring-sky-500 text-sm"
          />
          <span class="absolute right-2.5 top-2 text-[10px] text-slate-400 font-semibold">Litros</span>
        </div>
      </div>
      <div class="bg-slate-50 p-2.5 rounded-xl border border-slate-200/80">
        <label class="block text-[11px] font-medium text-slate-600 mb-1">8. Litros Agua Pura</label>
        <div class="relative">
          <input
            type="number"
            [(ngModel)]="params.totalPureWaterLiters"
            (ngModelChange)="onParamChange()"
            class="w-full px-2.5 py-1.5 border rounded-lg bg-white font-bold text-emerald-700 focus:ring-2 focus:ring-sky-500 text-sm"
          />
          <span class="absolute right-2.5 top-2 text-[10px] text-slate-400 font-semibold">Litros</span>
        </div>
      </div>
    </div>
  </div>
</div>
