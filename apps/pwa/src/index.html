<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Fildlab PWA | Técnicos de Campo</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#0284c7" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="Fildlab Perú - Aplicación móvil de campo offline-first para técnicos de tratamiento de agua" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
  </head>
  <body>
    <app-root></app-root>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((reg) => console.log('✓ Fildlab PWA Service Worker registrado:', reg.scope))
            .catch((err) => console.warn('Aviso SW:', err));
        });
      }
    </script>
  </body>
</html>
